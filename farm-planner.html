</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

</section>
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<strong style="font-family: Poppins, sans-serif; font-size: 17px; color: #134A27">Crop calendar</strong>
<div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px"><div data-as="m" data-for="{{months}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="{{m.style}}"></div><span style="font-size: 11px; color: #4F5D55">{{m.label}}</span></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #1E6B3A"></span>Sow</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B9E4C6"></span>Growing</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #D9A21B"></span>Harvest</span></div>

</section>
</div>
</div>
<section style="background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<strong style="font-family: Poppins, sans-serif; font-size: 17px; color: #134A27">What crop insurance covers</strong>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; color: #1E6B3A">Covered</span><span data-as="c" data-for="{{covered}}" style="font-size: 14px">✓ {{c}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; color: #C0392B">Not covered</span><span data-as="c" data-for="{{excluded}}" style="font-size: 14px">✕ {{c}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; background: #FBF3DE; border-radius: 12px; padding: 12px 14px"><span style="font-size: 13px; font-weight: 700; color: #6B4A00">Report losses fast</span><span style="font-size: 14px">Crop damage, fire or theft: within 7 days</span><span style="font-size: 14px">Transport accidents: within 48 hours</span><span style="font-size: 12px; color: #4F5D55">Hasad sends you the deadline when you report an event</span></div>
</div>
</section>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #4F5D55">Indicative figures from the 249Startups Sudan Crop Production &amp; Risk Reference Manual (kharif 2026, sample) based on FAO CFSAM 2024 and field sources. Costs vary by locality — check locally before committing money. Loan and insurance terms are set by the partner bank and insurer.</p>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { crop: 'sorghum', sys: 'sm', fd: 10, fx: false, yStep: 0, pStep: 0 }; }
  renderVals() {
    const ITEMS = {
      sorghum: ['Land preparation', 'Seed', 'Fertilizer (urea + DAP)', 'Crop protection', 'Labour (sowing, weeding)', 'Irrigation / water', 'Harvest and threshing', 'Transport', 'Sacks / post-harvest', 'Contingency'],
      sesame: ['Land preparation', 'Seed', 'Fertilizer', 'Crop protection', 'Labour (incl. harvest)', 'Irrigation / water', 'Harvest and threshing', 'Transport', 'Sacks / post-harvest', 'Contingency'],
      onion: ['Land and beds', 'Seedlings', 'Fertilizer (NPK, urea, organic)', 'Crop protection', 'Labour', 'Irrigation (pump, fuel)', 'Harvest and curing', 'Transport and sacks', 'Storage / loss reserve', 'Contingency']
    };
    const D = {
      sorghum: { label: 'Sorghum', price: 2500, sys: {
        trad: { cost: [80, 40, 0, 20, 200, 0, 120, 40, 40, 20], y: 300, dap: 0, urea: 0, fertNote: 'Optional: 1 bag DAP per feddan at sowing' },
        sm: { cost: [240, 100, 280, 120, 200, 0, 200, 80, 80, 100], y: 450, dap: 1, urea: 1, fertNote: 'Per feddan: 1 bag DAP at sowing, 1 bag urea at knee height' },
        irr: { cost: [320, 120, 480, 160, 320, 200, 280, 80, 100, 140], y: 1000, dap: 1.5, urea: 1.5, fertNote: 'Per feddan: 150 kg DAP and urea (plus potash if needed), split 3 times' } },
        months: ['s', 's', 'g', 'g', 'g', 'h', 'h', 'h', '', '', '', ''], cal: 'Sow mid-June to mid-July · harvest November to January · 110–140 days',
        store: ['Highly suitable', 'Stores 12+ months. Prices typically rise 25–40% from the December harvest to the July–September lean season. A certified warehouse receipt can unlock finance of 60–70% of the stored value.', 0.325],
        cov: ['Drought and rain shortage', 'Flooding and waterlogging', 'Sorghum midge, stem borer (after control)', 'Quelea birds and locusts'], exc: ['Striga (buda)', 'Smut', 'Price falls'] },
      sesame: { label: 'Sesame', price: 14000, sys: {
        trad: { cost: [80, 60, 0, 40, 320, 0, 200, 40, 40, 20], y: 120, dap: 0, urea: 0, fertNote: 'No fertilizer in the typical traditional budget' },
        sm: { cost: [240, 120, 200, 160, 360, 0, 240, 80, 80, 120], y: 180, dap: 1, urea: 0, fertNote: 'Per feddan: 1 bag DAP at sowing; no urea top-dress in kharif' },
        irr: { cost: [320, 140, 360, 200, 480, 200, 280, 80, 100, 160], y: 350, dap: 1, urea: 1, fertNote: 'Per feddan: 1 bag DAP and 1 bag urea, split' } },
        months: ['s', 's', 'g', 'g', 'h', 'h', '', '', '', '', '', ''], cal: 'Sow late June to late July · harvest October to November · 90–120 days',
        store: ['Highly suitable', 'Export crop with strong price discovery. Prices typically rise 15–30% from the November harvest to the February–May export peak. Receipts can unlock 65–75% finance.', 0.225],
        cov: ['Drought and rain shortage', 'Flooding and waterlogging', 'Webworm, gall midge (after control)'], exc: ['Capsule shatter at harvest', 'World price falls', 'Export contamination'] },
      onion: { label: 'Onion', price: 1200, sys: {
        irr: { cost: [360, 480, 720, 480, 1200, 600, 320, 200, 240, 200], y: 8000, dap: 0, urea: 0, fertNote: 'NPK 15-15-15 at transplant, urea top-dress, compost' } },
        months: ['s', 's', 'g', 'g', 'h', 'h', 'h', '', '', '', '', ''], cal: 'Transplant June to July · harvest October to December · mainly a winter crop',
        store: ['Limited', 'Stores only 2–4 months without cold storage, and losses can reach 30–40%. Plan to sell soon after harvest or use short-term storage.', 0],
        cov: ['Excess rain and waterlogging', 'Downy mildew, purple blotch (after control)', 'Thrips (after control)'], exc: ['Rot or sprouting after harvest', 'Price collapse'] }
    };
    const SYS = [['trad', 'Rain-fed, traditional', 'Hand tools, small plots'], ['sm', 'Rain-fed, semi-mechanised', 'Tractor ploughing, larger blocks'], ['irr', 'Irrigated', 'Schemes, pumps, river plots']];
    const st = this.state;
    const crop = D[st.crop];
    const sysKey = crop.sys[st.sys] ? st.sys : 'irr';
    const s = crop.sys[sysKey];
    const fxF = st.fx ? 6150 / 4000 : 1;
    const fmt = (n) => 'SDG ' + Math.round(n).toLocaleString('en-US');
    const short = (n) => Math.abs(n) >= 1e6 ? (n < 0 ? '−' : '') + 'SDG ' + (Math.abs(n) / 1e6).toFixed(1) + 'M' : (n < 0 ? '−' : '') + 'SDG ' + Math.round(Math.abs(n)).toLocaleString('en-US');
    const perFd = s.cost.reduce((a, b) => a + b, 0) * 1000 * fxF;
    const yld = Math.round(s.y * (1 + 0.1 * st.yStep));
    const price = Math.round(crop.price * (1 + 0.1 * st.pStep));
    const cost = perFd * st.fd;
    const rev = yld * price * st.fd;
    const margin = rev - cost;
    const btn = (on) => 'font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 10px; cursor: pointer; ' + (on ? 'background: #1E6B3A; color: #FFFFFF; border: 1px solid #1E6B3A' : 'background: #FFFFFF; color: #134A27; border: 1px solid #C9D6CD');
    const crops = Object.keys(D).map((k) => ({ label: D[k].label, pick: () => this.setState({ crop: k, yStep: 0, pStep: 0, sys: D[k].sys[this.state.sys] ? this.state.sys : 'irr' }), style: btn(st.crop === k) }));
    const systems = SYS.map(([k, label, note]) => {
      const ok = !!crop.sys[k];
      const on = sysKey === k;
      return { label, note: ok ? note : 'Not typical for this crop in kharif', pick: () => ok && this.setState({ sys: k, yStep: 0 }), style: 'font: inherit; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; cursor: ' + (ok ? 'pointer' : 'not-allowed') + '; opacity: ' + (ok ? 1 : 0.5) + '; background: ' + (on ? '#E8F3EC' : '#FFFFFF') + '; border: 2px solid ' + (on ? '#1E6B3A' : '#DCE3DD') + '; color: #1F2A24' };
    });
    const rows = s.cost.map((v, i) => ({ item: ITEMS[st.crop][i], per: v ? fmt(v * 1000 * fxF) : '—', total: v ? short(v * 1000 * fxF * st.fd) : '—' })).concat([{ item: 'Total', per: fmt(perFd), total: short(cost) }]);
    const dapB = s.dap * st.fd, ureaB = s.urea * st.fd;
    const fertTotal = st.crop === 'onion' ? 'NPK + urea' : (dapB + ureaB === 0 ? 'None required' : [dapB ? dapB + ' bags DAP' : '', ureaB ? ureaB + ' bags urea' : ''].filter(Boolean).join(' + '));

      const k = crop.months[i];
      const c = k === 's' ? '#1E6B3A' : k === 'g' ? '#B9E4C6' : k === 'h' ? '#D9A21B' : '#EEF1EF';
      return { label, style: 'width: 100%; height: 26px; border-radius: 5px; background: ' + c };
    });
    const loss = margin < 0;
    return {
      crops, systems, rows, months,
      fdLabel: st.fd + ' feddan' + (st.fd === 1 ? '' : 's'),
      fdDown: () => this.setState({ fd: Math.max(1, this.state.fd - (this.state.fd > 10 ? 5 : 1)) }),

      pDown: () => this.setState({ pStep: Math.max(-5, this.state.pStep - 1) }), pUp: () => this.setState({ pStep: Math.min(10, this.state.pStep + 1) }),
      refNote: 'Typical yield ' + s.y.toLocaleString('en-US') + ' kg/fd · reference farm-gate price SDG ' + crop.price.toLocaleString('en-US') + '/kg' + (st.crop === 'sorghum' ? ' (WFP national retail, Aug 2026: SDG 2,465/kg)' : ''),
      fxOff: () => this.setState({ fx: false }), fxOn: () => this.setState({ fx: true }),
      fxOffStyle: btn(!st.fx) + '; flex: 1; border: 0', fxOnStyle: btn(st.fx) + '; flex: 1; border: 0',
      fxNote: st.fx ? 'Manual costs scaled from SDG 4,000 to SDG 6,150 per USD (WFP, Aug 2026). Calculated estimate.' : 'Costs as published in July 2026, at SDG 4,000 per USD (parallel rate).',
      cost: short(cost), costPerFd: fmt(perFd) + ' per feddan',
      revenue: short(rev), revNote: yld.toLocaleString('en-US') + ' kg × SDG ' + price.toLocaleString('en-US') + ' × ' + st.fd + ' fd',
      margin: short(margin), marginPerFd: short(margin / st.fd) + ' per feddan',
      marginCard: 'background: ' + (loss ? '#FDECEA' : '#FFFFFF') + '; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; border-top: 5px solid ' + (loss ? '#C0392B' : '#1E6B3A'),
      marginStyle: 'font-family: Poppins, sans-serif; font-size: 24px; color: ' + (loss ? '#C0392B' : '#134A27'),
      breakEven: Math.round(perFd / price).toLocaleString('en-US') + ' kg/fd', isLoss: loss,
      loan: short(cost * 1.1), premium: short(cost * 0.05), sumInsured: short(cost),
      fertTotal, fertRate: s.fertNote,
      calNote: crop.cal,
      storeRating: crop.store[0], storeText: crop.store[1],
      storeBadge: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; ' + (crop.store[2] ? 'color: #FFFFFF; background: #1E6B3A' : 'color: #6B4A00; background: #FBF3DE'),
      storeGain: crop.store[2] ? 'Storing to the seasonal peak could add about ' + short(rev * crop.store[2]) + ' (mid-range, before storage costs).' : 'Selling at harvest is usually safer for this crop.',
      covered: crop.cov, excluded: crop.exc
    };
  }
