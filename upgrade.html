<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasad — Upgrade to unlock Market Data</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
body{margin:0}
a{color:#1E6B3A}a:hover{color:#134A27}
</style>
<style>body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box;background:#DDE5DF}#app>div{border-radius:28px;box-shadow:0 20px 60px rgba(19,74,39,.25)}@media (max-width:430px){body{padding:0;background:#F6F1E7}#app>div{border-radius:0;box-shadow:none;width:100vw!important;height:100vh!important}}</style>
<script src="assets/runtime.js"></script>
<script src="assets/menu.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #1F2A24; background: #F6F1E7; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="background: #1E6B3A; color: #FFFFFF; padding: 16px 18px; display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" height="30" viewbox="0 0 36 36" width="30"><rect fill="#FFFFFF" height="36" rx="10" width="36"></rect><path d="M18 30V14" stroke="#1E6B3A" stroke-linecap="round" stroke-width="2.2"></path><ellipse cx="18" cy="10.5" fill="#D9A21B" rx="3.4" ry="5.2"></ellipse><path d="M18 24c-4.5-.8-6.5-3.6-6.5-7 3.6.2 6.2 2.6 6.5 7zM18 20.5c4.5-.8 6.5-3.6 6.5-7-3.6.2-6.2 2.6-6.5 7z" fill="#4CAF6A"></path></svg>
<strong style="font-family: Poppins, sans-serif; font-size: 17px">Market Data</strong>
<span style="margin-left: auto; font-size: 12px; font-weight: 600; color: #134A27; background: #E8F3EC; padding: 4px 10px; border-radius: 999px">Basic plan</span>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="background: #134A27; color: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #F2C14E">Free · Monthly headline · Aug 2026</span>
<strong style="font-family: Poppins, sans-serif; font-size: 17px; line-height: 1.3">Food prices nearly doubled in a year while farm wages stood still</strong>
</div>
<div aria-hidden="true" style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; opacity: .45">
<span style="font-size: 13px; color: #5D6B63">Sorghum (3 kg) · your markets</span>
<div style="height: 14px; border-radius: 4px; background: #C9D6CD; width: 80%"></div>
<div style="height: 14px; border-radius: 4px; background: #C9D6CD; width: 62%"></div>
<div style="height: 14px; border-radius: 4px; background: #C9D6CD; width: 70%"></div>
<div style="height: 90px; border-radius: 10px; background: #E8F3EC"></div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 32px rgba(19,74,39,.18); padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 44px; height: 5px; border-radius: 9px; background: #DCE3DD; align-self: center"></div>
<div style="width: 48px; height: 48px; border-radius: 14px; background: #FBF3DE; display: grid; place-items: center"><svg aria-hidden="true" fill="none" height="24" stroke="#8A5A3B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><rect height="10" rx="2" width="14" x="5" y="11"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></div>
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-size: 21px; line-height: 1.25; color: #134A27">See prices in every market</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3A4740">Upgrade to Grow to see food, fertilizer, seed, fuel and currency prices for your state, read the full monthly analysis, and get funding deadline reminders.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<button data-as="p" data-for="{{plans}}" onclick="{{p.pick}}" style="{{p.style}}" type="button"><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><strong style="font-size: 15px">{{p.name}}</strong><span style="font-size: 12px; color: #5D6B63">{{p.note}}</span></span><strong style="font-size: 15px">{{p.price}}</strong></button>
</div>
<a href="pricing.html" style="text-align: center; font-size: 16px; font-weight: 600; color: #FFFFFF; background: #1E6B3A; text-decoration: none; padding: 15px; border-radius: 12px">Upgrade to {{chosen}}</a>
<a href="pricing.html" style="text-align: center; font-size: 14px; font-weight: 600">Compare all plans</a>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'grow' }; }
  renderVals() {
    const list = [
      { id: 'grow', name: 'Grow', note: 'Full Market Data · alerts', price: '$5 / month' },
      { id: 'business', name: 'Business', note: '+ price alerts and CSV export', price: '$25 / month' }
    ];
    const plans = list.map((p) => {
      const on = this.state.pick === p.id;
      return Object.assign({}, p, {
        pick: () => this.setState({ pick: p.id }),
        style: 'font: inherit; color: #1F2A24; display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 12px; cursor: pointer; background: ' + (on ? '#E8F3EC' : '#FFFFFF') + '; border: 2px solid ' + (on ? '#1E6B3A' : '#DCE3DD')
      });
    });
    const chosen = (list.find((p) => p.id === this.state.pick) || list[0]).name;
    return { plans, chosen };
  }
}
window.__hasadMount(Component, {});
</script>
</body>
</html>
