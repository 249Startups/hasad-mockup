<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { annual: false }; }
  renderVals() {
    const g = this.props.growMonthly ?? 5;
    const b = this.props.businessMonthly ?? 25;
    const annual = this.state.annual;
    const on = 'font: inherit; font-size: 14px; font-weight: 600; border: 0; padding: 10px 18px; border-radius: 999px; cursor: pointer; background: #1E6B3A; color: #FFFFFF';
    const off = 'font: inherit; font-size: 14px; font-weight: 600; border: 0; padding: 10px 18px; border-radius: 999px; cursor: pointer; background: transparent; color: #134A27';
    return {
      growPrice: '$' + (annual ? g * 10 : g),
      businessPrice: '$' + (annual ? b * 10 : b),
      period: annual ? 'per year' : 'per month',
      monthlyStyle: annual ? off : on,
      annualStyle: annual ? on : off,
      setMonthly: () => this.setState({ annual: false }),
      setAnnual: () => this.setState({ annual: true })
    };
  }
}
window.__hasadMount(Component, {"growMonthly": 5, "businessMonthly": 25});
