<h2 style="margin: 0; font-family: Poppins, sans-serif; font-size: 26px; line-height: 1.25">Food prices nearly doubled in a year while farm wages stood still</h2>
<ol style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; color: #E4F0E8; display: flex; flex-direction: column; gap: 6px">
<li>Sorghum averaged SDG 2,465/kg, up 94% on August 2025; the WFP food basket rose 94% too.</li>
<li>A day's farm wage now buys about 7 kg of sorghum, down from about 13 kg.</li>
<li>The pound fell to SDG 6,150 per dollar on the parallel market; diesel is up 133–155%.</li>
<li>Urea and DAP prices held steady, but DAP is getting harder to find.</li>
<li>Rains were 45% of normal or less in northern Sudan; expect only a small harvest dip in prices.</li>
</ol>
